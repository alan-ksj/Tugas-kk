<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Earth Explorer</title>
<style>
:root{--ink:#e9e4d8;--soft:#9aa0b4;--ember:#e8873a;--night:#03040b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-behavior:smooth}
body{margin:0;min-height:100%;background:var(--night);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.hero{position:relative;min-height:100svh;overflow:hidden;}
#bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 35%,rgba(3,4,11,.75) 100%)}
</style>
</head>
<body>
<header class="hero">
  <canvas id="bg" aria-hidden="true"></canvas>
</header>
<script>
(function(){
var c=document.getElementById('bg'),x=c.getContext('2d'),w,h,dpr,stars=[],shoot=null,nextShoot=3000;
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var rings=[[1,'#1d2a18'],[.93,'#3d1d0c'],[.76,'#4a1410'],[.5,'#5c3f0e'],[.22,'#7a6a48']];
function size(){
  dpr=Math.min(devicePixelRatio||1,2);w=c.clientWidth;h=c.clientHeight;
  c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0);
  stars=[];for(var i=0,n=Math.round(w*h/4500);i<n;i++)stars.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.1+.2,v:Math.random()*.12+.02,p:Math.random()*6.28});
}
function draw(t){
  var g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#02030a');g.addColorStop(1,'#0b0f22');
  x.fillStyle=g;x.fillRect(0,0,w,h);
  for(var i=0;i<stars.length;i++){var s=stars[i];
    if(!reduce){s.y-=s.v*.25;s.x-=s.v*.1;if(s.y<0)s.y=h;if(s.x<0)s.x=w;}
    x.globalAlpha=.35+.55*Math.abs(Math.sin(t*.0008*(s.v*10)+s.p));
    x.fillStyle='#dfe6ff';x.beginPath();x.arc(s.x,s.y,s.r,0,6.283);x.fill();}
  x.globalAlpha=1;
  var cx=w/2,cy=h*1.02,R=Math.min(w*.95,h*.6);
  var gl=x.createRadialGradient(cx,cy,R*.9,cx,cy,R*1.5);
  gl.addColorStop(0,'rgba(232,110,40,.28)');gl.addColorStop(1,'rgba(232,110,40,0)');
  x.fillStyle=gl;x.fillRect(0,0,w,h);
  for(var j=0;j<rings.length;j++){x.fillStyle=rings[j][1];x.beginPath();x.arc(cx,cy,R*rings[j][0],0,6.283);x.fill();}
  if(x.createConicGradient){
    var cg=x.createConicGradient(t*.00012,cx,cy);
    cg.addColorStop(0,'rgba(255,170,90,.22)');cg.addColorStop(.12,'rgba(255,170,90,0)');cg.addColorStop(1,'rgba(255,170,90,0)');
    x.fillStyle=cg;x.beginPath();x.arc(cx,cy,R,0,6.283);x.fill();
  }
  x.strokeStyle='rgba(255,200,150,.35)';x.lineWidth=1;x.beginPath();x.arc(cx,cy,R,0,6.283);x.stroke();
  if(!reduce){
    if(!shoot&&t>nextShoot){shoot={x:Math.random()*w*.8+w*.2,y:Math.random()*h*.3,l:0};nextShoot=t+5000+Math.random()*6000;}
    if(shoot){shoot.l+=7;var sx=shoot.x-shoot.l,sy=shoot.y+shoot.l*.45;
      var sg=x.createLinearGradient(shoot.x,shoot.y,sx,sy);sg.addColorStop(0,'rgba(255,255,255,.8)');sg.addColorStop(1,'rgba(255,255,255,0)');
      x.strokeStyle=sg;x.beginPath();x.moveTo(shoot.x,shoot.y);x.lineTo(sx,sy);x.stroke();
      if(shoot.l>140)shoot=null;}
  }
}
function loop(t){draw(t);if(!reduce)requestAnimationFrame(loop);}
size();addEventListener('resize',function(){size();if(reduce)draw(0);});
reduce?draw(0):requestAnimationFrame(loop);
})();
</script>
</body>
</html>
